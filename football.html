<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BetKigali - Football</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #080b0f;
      color: white;
    }

    header {
      background: #0d1218;
      border-bottom: 1px solid #202832;
      padding: 15px 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo img {
      width: 145px;
      height: auto;
      display: block;
    }

    nav {
      display: flex;
      gap: 18px;
      overflow-x: auto;
    }

    nav a {
      color: #c9d0d8;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
    }

    nav a:hover {
      color: #f5c542;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 25px;
    }

    .title {
      margin-bottom: 20px;
    }

    .title h1 {
      color: #f5c542;
      margin-bottom: 8px;
    }

    .title p {
      color: #9ca7b3;
    }

    .status {
      background: #11171e;
      border: 1px solid #242d37;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 20px;
      color: #cbd5e1;
    }

    .matches {
      display: grid;
      gap: 15px;
    }

    .match {
      background: #11171e;
      border: 1px solid #242d37;
      border-radius: 12px;
      padding: 18px;
    }

    .league {
      color: #f5c542;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .teams {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 15px;
    }

    .team {
      font-size: 17px;
      font-weight: bold;
    }

    .away {
      text-align: right;
    }

    .vs {
      color: #64748b;
      font-weight: bold;
    }

    .info {
      margin-top: 12px;
      color: #9ca7b3;
      font-size: 14px;
    }

    .live {
      display: inline-block;
      background: #dc2626;
      color: white;
      padding: 4px 8px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: bold;
      margin-left: 8px;
    }

    .empty {
      background: #11171e;
      border: 1px solid #242d37;
      border-radius: 12px;
      padding: 25px;
      text-align: center;
      color: #9ca7b3;
    }

    @media (max-width: 700px) {
      header {
        flex-wrap: wrap;
      }

      nav {
        width: 100%;
        order: 3;
      }

      .container {
        padding: 18px 12px;
      }

      .team {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

<header>

  <a href="index.html" class="logo">
    <img src="betkigali-logo.png" alt="BetKigali Logo">
  </a>

  <nav>
    <a href="index.html">Home</a>
    <a href="football.html">Football</a>
    <a href="#">Live</a>
    <a href="#">My Bets</a>
    <a href="#">Casino</a>
  </nav>

</header>

<main class="container">

  <div class="title">
    <h1>⚽ Football</h1>
    <p>Football matches powered by BetKigali Sports API.</p>
  </div>

  <div id="status" class="status">
    Loading football matches...
  </div>

  <div id="matches" class="matches"></div>

</main>

<script>

  const API_URL =
    "https://betkigali.geekemo226.workers.dev";

  async function loadMatches() {

    const status = document.getElementById("status");
    const container = document.getElementById("matches");

    try {

      const today =
        new Date().toISOString().split("T")[0];

      const response = await fetch(
        `${API_URL}/api/fixtures?date=${today}`
      );

      if (!response.ok) {
        throw new Error("API request failed");
      }

      const data = await response.json();

      if (!data.response || data.response.length === 0) {

        status.textContent =
          "No football matches found for today.";

        container.innerHTML = `
          <div class="empty">
            No matches available right now.
          </div>
        `;

        return;
      }

      status.textContent =
        `${data.response.length} football matches found.`;

      container.innerHTML =
        data.response.map(item => {

          const fixture = item.fixture;
          const league = item.league;
          const teams = item.teams;
          const goals = item.goals;

          const isLive =
            fixture.status.short === "1H" ||
            fixture.status.short === "2H" ||
            fixture.status.short === "HT" ||
            fixture.status.short === "ET";

          return `

            <div class="match">

              <div class="league">
                ${league.name || "Football"}
                ${isLive ? '<span class="live">LIVE</span>' : ""}
              </div>

              <div class="teams">

                <div class="team">
                  ${teams.home.name}
                </div>

                <div class="vs">
                  ${
                    goals.home !== null &&
                    goals.away !== null
                      ? `${goals.home} - ${goals.away}`
                      : "VS"
                  }
                </div>

                <div class="team away">
                  ${teams.away.name}
                </div>

              </div>

              <div class="info">

                📅 ${new Date(fixture.date).toLocaleDateString()}

                &nbsp;&nbsp;

                ⏰ ${new Date(fixture.date).toLocaleTimeString([], {
                  hour: "2-digit",
                  minute: "2-digit"
                })}

                &nbsp;&nbsp;

                📍 ${fixture.venue?.name || "Venue TBA"}

              </div>

            </div>

          `;

        }).join("");

    } catch (error) {

      console.error(error);

      status.textContent =
        "Unable to load football matches.";

      container.innerHTML = `
        <div class="empty">
          There was a problem connecting to BetKigali Sports API.
          Please try again later.
        </div>
      `;
    }
  }

  loadMatches();

</script>

</body>
</html>
