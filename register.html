<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BetKigali - Register</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #080b0f;
      color: white;
      font-family: Arial, sans-serif;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .register-box {
      width: 100%;
      max-width: 420px;

      background: #11171e;
      border: 1px solid #242d37;
      border-radius: 16px;

      padding: 30px;

      box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo img {
      width: 160px;
      max-width: 80%;
      height: auto;
    }

    h1 {
      text-align: center;
      color: #f5c542;
      margin-bottom: 8px;
      font-size: 25px;
    }

    .subtitle {
      text-align: center;
      color: #9ca7b3;
      margin-bottom: 25px;
      font-size: 14px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #cbd5e1;
      font-size: 14px;
      font-weight: bold;
    }

    .field {
      margin-bottom: 18px;
    }

    input {
      width: 100%;
      padding: 14px;

      background: #080b0f;
      color: white;

      border: 1px solid #303a46;
      border-radius: 9px;

      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #f5c542;
    }

    .register-btn {
      width: 100%;

      padding: 14px;

      background: #f5c542;
      color: #080b0f;

      border: none;
      border-radius: 9px;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
    }

    .register-btn:hover {
      background: #ffd75c;
    }

    .register-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      display: none;

      margin-bottom: 18px;
      padding: 12px;

      border-radius: 8px;

      font-size: 14px;
      line-height: 1.4;
    }

    .message.error {
      display: block;
      background: #3b1111;
      border: 1px solid #7f1d1d;
      color: #fecaca;
    }

    .message.success {
      display: block;
      background: #0d2b1a;
      border: 1px solid #166534;
      color: #bbf7d0;
    }

    .loading {
      display: none;
      text-align: center;
      color: #f5c542;
      margin-top: 12px;
      font-size: 13px;
    }

    .login-link {
      text-align: center;
      margin-top: 20px;
      color: #9ca7b3;
      font-size: 14px;
    }

    .login-link a {
      color: #f5c542;
      text-decoration: none;
      font-weight: bold;
    }

    .login-link a:hover {
      text-decoration: underline;
    }

    .back-home {
      text-align: center;
      margin-top: 15px;
    }

    .back-home a {
      color: #64748b;
      text-decoration: none;
      font-size: 13px;
    }

    .back-home a:hover {
      color: #f5c542;
    }

    .note {
      margin-top: 15px;
      color: #64748b;
      text-align: center;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<div class="register-box">

  <div class="logo">
    <a href="index.html">
      <img
        src="betkigali-logo.png"
        alt="BetKigali"
      >
    </a>
  </div>

  <h1>Create Account</h1>

  <p class="subtitle">
    Register your BetKigali account
  </p>

  <div id="message" class="message"></div>

  <form id="registerForm">

    <div class="field">

      <label for="phone">
        Phone Number
      </label>

      <input
        type="tel"
        id="phone"
        placeholder="e.g. 0781234567"
        autocomplete="tel"
        required
      >

    </div>


    <div class="field">

      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="At least 6 characters"
        autocomplete="new-password"
        minlength="6"
        required
      >

    </div>


    <div class="field">

      <label for="confirmPassword">
        Confirm Password
      </label>

      <input
        type="password"
        id="confirmPassword"
        placeholder="Repeat your password"
        autocomplete="new-password"
        minlength="6"
        required
      >

    </div>


    <button
      type="submit"
      id="registerBtn"
      class="register-btn"
    >
      Create Account
    </button>


    <div id="loading" class="loading">
      Creating your account...
    </div>

  </form>


  <div class="login-link">
    Already have an account?
    <a href="login.html">
      Login
    </a>
  </div>


  <div class="back-home">
    <a href="index.html">
      ← Back to Home
    </a>
  </div>


  <div class="note">
    Your account starts with 0 FRW balance
    and 0 FRW bonus balance.
  </div>

</div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
  "https://nezgaxfisytlgkhdgzvf.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_H1N6DRzZ0t25MARQP5yaPQ_l6mRsrVGs";


const supabase =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================
   ELEMENTS
========================================= */

const form =
  document.getElementById("registerForm");

const phoneInput =
  document.getElementById("phone");

const passwordInput =
  document.getElementById("password");

const confirmPasswordInput =
  document.getElementById("confirmPassword");

const registerBtn =
  document.getElementById("registerBtn");

const messageBox =
  document.getElementById("message");

const loading =
  document.getElementById("loading");


/* =========================================
   MESSAGE
========================================= */

function showMessage(text, type) {

  messageBox.textContent = text;

  if (!text) {
    messageBox.className = "message";
    return;
  }

  messageBox.className =
    "message " + type;
}


/* =========================================
   NORMALIZE PHONE
========================================= */

function normalizePhone(value) {

  let phone =
    value
      .trim()
      .replace(/\s+/g, "");


  /*
    0781234567
    →
    250781234567
  */

  if (phone.startsWith("0")) {

    phone =
      "250" +
      phone.substring(1);

  }


  /*
    +250781234567
    →
    250781234567
  */

  if (phone.startsWith("+")) {

    phone =
      phone.substring(1);

  }


  return phone;
}


/* =========================================
   INTERNAL EMAIL
========================================= */

function makeAuthEmail(phone) {

  return (
    phone +
    "@auth.betkigali.local"
  );
}


/* =========================================
   SAVE USER
========================================= */

function saveUser(user, profile) {

  const userData = {

    id: user.id,

    user_id: user.id,

    phone:
      profile.phone,

    balance:
      Number(profile.balance || 0),

    bonus_balance:
      Number(profile.bonus_balance || 0),

    role:
      profile.role || "customer"

  };


  /*
    This is the key used by index.html.
  */

  localStorage.setItem(
    "betkigaliUser",
    JSON.stringify(userData)
  );


  localStorage.setItem(
    "betkigaliProfile",
    JSON.stringify(userData)
  );


  localStorage.setItem(
    "betkigaliLoggedIn",
    "true"
  );


  return userData;
}


/* =========================================
   REGISTER
========================================= */

form.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    showMessage("", "");


    registerBtn.disabled =
      true;

    loading.style.display =
      "block";


    try {

      /* -------------------------------
         VALUES
      ------------------------------- */

      const rawPhone =
        phoneInput.value;

      const password =
        passwordInput.value;

      const confirmPassword =
        confirmPasswordInput.value;


      /* -------------------------------
         PHONE
      ------------------------------- */

      const phone =
        normalizePhone(
          rawPhone
        );


      if (!phone) {

        throw new Error(
          "Please enter your phone number."
        );

      }


      if (phone.length < 9) {

        throw new Error(
          "Please enter a valid Rwanda phone number."
        );

      }


      /* -------------------------------
         PASSWORD
      ------------------------------- */

      if (password.length < 6) {

        throw new Error(
          "Password must contain at least 6 characters."
        );

      }


      if (
        password !==
        confirmPassword
      ) {

        throw new Error(
          "Passwords do not match."
        );

      }


      /* -------------------------------
         INTERNAL EMAIL
      ------------------------------- */

      const authEmail =
        makeAuthEmail(
          phone
        );


      loading.textContent =
        "Creating your account...";


      /* -------------------------------
         SUPABASE AUTH
      ------------------------------- */

      const result =
        await supabase.auth.signUp({

          email:
            authEmail,

          password:
            password,

          options: {

            data: {

              phone:
                phone

            }

          }

        });


      const data =
        result.data;

      const error =
        result.error;


      if (error) {
        throw error;
      }


      if (!data || !data.user) {

        throw new Error(
          "Account could not be created."
        );

      }


      /* =================================
         IMPORTANT
      =================================

         We need an active session before
         inserting into profiles because
         your profiles RLS requires:

         auth.uid() = id
      */


      if (!data.session) {

        throw new Error(
          "Account was created, but Supabase has email confirmation enabled. Turn OFF email confirmation in Supabase Authentication settings, then try registering again."
        );

      }


      /* -------------------------------
         CREATE PROFILE
      ------------------------------- */

      loading.textContent =
        "Creating your profile...";


      const profileResult =
        await supabase
          .from("profiles")
          .insert({

            id:
              data.user.id,

            phone:
              phone,

            profile_picture:
              "",

            balance:
              0,

            bonus_balance:
              0,

            role:
              "customer"

          })
          .select()
          .single();


      if (profileResult.error) {

        console.error(
          "PROFILE ERROR:",
          profileResult.error
        );


        /*
          If profile failed, sign out.
        */

        await supabase.auth.signOut();


        throw profileResult.error;

      }


      const profile =
        profileResult.data;


      /* -------------------------------
         SAVE LOGIN STATE
      ------------------------------- */

      saveUser(
        data.user,
        profile
      );


      /* -------------------------------
         SUCCESS
      ------------------------------- */

      showMessage(
        "Account created successfully. Opening BetKigali...",
        "success"
      );


      loading.textContent =
        "Opening BetKigali...";


      /*
        Go directly to index.html.
      */

      window.location.replace(
        "index.html"
      );


    } catch (error) {

      console.error(
        "REGISTRATION ERROR:",
        error
      );


      let errorMessage =
        error?.message ||
        "Registration failed. Please try again.";


      const lower =
        errorMessage.toLowerCase();


      /* -------------------------------
         FRIENDLY ERRORS
      ------------------------------- */

      if (
        lower.includes(
          "user already registered"
        ) ||
        lower.includes(
          "already registered"
        )
      ) {

        errorMessage =
          "This phone number is already registered. Please login.";

      }


      if (
        lower.includes(
          "duplicate key"
        )
      ) {

        errorMessage =
          "This phone number already has a profile.";

      }


      if (
        lower.includes(
          "row-level security"
        ) ||
        lower.includes(
          "violates row-level security"
        )
      ) {

        errorMessage =
          "Profile creation was blocked by Supabase security settings. Check the profiles INSERT policy.";

      }


      showMessage(
        errorMessage,
        "error"
      );


    } finally {

      registerBtn.disabled =
        false;

      loading.style.display =
        "none";

    }

  }
);

</script>

</body>
</html>
```
