<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BetKigali - Register</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --black: #07090d;
      --black2: #0d1117;
      --card: #11161d;
      --border: #242c35;
      --gold: #f5c542;
      --gold2: #ffd966;
      --white: #ffffff;
      --muted: #9ca7b3;
      --green: #16a34a;
      --red: #dc2626;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--black);
      color: var(--white);
      min-height: 100vh;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      height: 82px;
      background: #090d12;
      border-bottom: 1px solid var(--border);

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 10px 28px;
    }

    .logo img {
      width: 120px;
      max-height: 62px;
      object-fit: contain;
      display: block;
    }

    .back-home {
      color: var(--gold);
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
    }

    .back-home:hover {
      color: var(--gold2);
    }

    /* =========================
       PAGE
    ========================= */

    .page {
      width: min(500px, 92%);
      margin: 45px auto;
    }

    .register-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 30px;
      box-shadow: 0 12px 35px rgba(0,0,0,.3);
    }

    .title {
      text-align: center;
      margin-bottom: 28px;
    }

    .title h1 {
      color: var(--gold);
      font-size: 28px;
      margin-bottom: 8px;
    }

    .title p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    /* =========================
       FORM
    ========================= */

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      color: #dce2e8;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 13px 14px;

      background: #090d12;
      color: white;

      border: 1px solid var(--border);
      border-radius: 8px;

      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 2px rgba(245,197,66,.08);
    }

    .phone-wrapper {
      display: flex;
      gap: 8px;
    }

    .country-code {
      width: 82px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;

      background: #090d12;
      border: 1px solid var(--border);
      border-radius: 8px;

      color: var(--gold);
      font-weight: bold;
      font-size: 14px;
    }

    .phone-wrapper input {
      flex: 1;
    }

    .hint {
      color: #727d89;
      font-size: 11px;
      margin-top: 6px;
    }

    /* =========================
       TERMS
    ========================= */

    .terms {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin: 20px 0;
    }

    .terms input {
      width: 16px;
      height: 16px;
      margin-top: 1px;
      accent-color: var(--gold);
    }

    .terms label {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      font-weight: normal;
    }

    .terms a {
      color: var(--gold);
      text-decoration: none;
    }

    /* =========================
       BUTTON
    ========================= */

    .register-btn {
      width: 100%;
      padding: 14px;

      background: var(--gold);
      color: #111;

      border: none;
      border-radius: 8px;

      font-size: 15px;
      font-weight: bold;

      cursor: pointer;
      transition: .2s;
    }

    .register-btn:hover {
      background: var(--gold2);
    }

    .register-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    /* =========================
       MESSAGE
    ========================= */

    .message {
      display: none;

      padding: 11px 13px;
      border-radius: 7px;

      margin-bottom: 16px;

      font-size: 13px;
      line-height: 1.4;
    }

    .message.error {
      display: block;
      background: rgba(220,38,38,.12);
      border: 1px solid rgba(220,38,38,.35);
      color: #fca5a5;
    }

    .message.success {
      display: block;
      background: rgba(22,163,74,.12);
      border: 1px solid rgba(22,163,74,.35);
      color: #86efac;
    }

    /* =========================
       LOGIN LINK
    ========================= */

    .login-link {
      text-align: center;
      margin-top: 22px;

      color: var(--muted);
      font-size: 13px;
    }

    .login-link a {
      color: var(--gold);
      text-decoration: none;
      font-weight: bold;
    }

    /* =========================
       SECURITY
    ========================= */

    .security {
      margin-top: 20px;
      padding-top: 17px;

      border-top: 1px solid var(--border);

      text-align: center;
      color: #687380;
      font-size: 11px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 500px) {

      header {
        padding: 10px 16px;
      }

      .logo img {
        width: 105px;
      }

      .page {
        margin: 25px auto;
      }

      .register-card {
        padding: 23px 18px;
      }

      .title h1 {
        font-size: 25px;
      }

      .country-code {
        width: 72px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->

  <header>

    <a href="index.html" class="logo">
      <img
        src="betkigali-logo.png"
        alt="BetKigali"
      >
    </a>

    <a
      href="index.html"
      class="back-home"
    >
      ← Home
    </a>

  </header>


  <!-- =========================
       REGISTER
  ========================== -->

  <main class="page">

    <div class="register-card">

      <div class="title">

        <h1>
          Create Account
        </h1>

        <p>
          Join BetKigali and start enjoying
          our services.
        </p>

      </div>


      <div
        id="message"
        class="message"
      ></div>


      <form
        id="registerForm"
        autocomplete="off"
      >

        <!-- PHONE -->

        <div class="form-group">

          <label for="phone">
            Phone Number
          </label>

          <div class="phone-wrapper">

            <div class="country-code">
              +250
            </div>

            <input
              type="tel"
              id="phone"
              name="phone"
              placeholder="7XXXXXXXX"
              maxlength="9"
              inputmode="numeric"
              required
            >

          </div>

          <div class="hint">
            Enter your Rwanda mobile number.
          </div>

        </div>


        <!-- PASSWORD -->

        <div class="form-group">

          <label for="password">
            Password
          </label>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="Create a password"
            minlength="6"
            required
          >

        </div>


        <!-- CONFIRM PASSWORD -->

        <div class="form-group">

          <label for="confirmPassword">
            Confirm Password
          </label>

          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="Repeat your password"
            minlength="6"
            required
          >

        </div>


        <!-- TERMS -->

        <div class="terms">

          <input
            type="checkbox"
            id="terms"
            required
          >

          <label for="terms">

            I agree to the
            <a href="#">
              Terms & Conditions
            </a>
            and understand the
            BetKigali rules.

          </label>

        </div>


        <!-- BUTTON -->

        <button
          type="submit"
          class="register-btn"
          id="registerButton"
        >
          Create Account
        </button>

      </form>


      <!-- LOGIN -->

      <div class="login-link">

        Already have an account?

        <a href="login.html">
          Login
        </a>

      </div>


      <div class="security">
        🔒 Your account information is kept secure.
      </div>

    </div>

  </main>


  <script>

    /*
    ==========================================
       BETKIGALI REGISTER
    ==========================================

       PHONE ONLY
       NO EMAIL

       After successful registration:
       → save customer session
       → redirect directly to index.html

       IMPORTANT:
       This customer account is separate
       from the admin account.
    ==========================================
    */


    const form =
      document.getElementById(
        "registerForm"
      );

    const message =
      document.getElementById(
        "message"
      );

    const button =
      document.getElementById(
        "registerButton"
      );


    /*
    ==========================================
       SHOW MESSAGE
    ==========================================
    */

    function showMessage(
      text,
      type
    ) {

      message.textContent = text;

      message.className =
        "message " + type;

    }


    /*
    ==========================================
       PHONE VALIDATION
    ==========================================
    */

    function validRwandaPhone(phone) {

      /*
        Accepted local format:
        7XXXXXXXX

        Example:
        788123456
      */

      return /^7\d{8}$/.test(phone);

    }


    /*
    ==========================================
       REGISTER
    ==========================================
    */

    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        showMessage("", "");

        const phone =
          document
            .getElementById("phone")
            .value
            .replace(/\D/g, "");

        const password =
          document
            .getElementById("password")
            .value;

        const confirmPassword =
          document
            .getElementById("confirmPassword")
            .value;

        const terms =
          document
            .getElementById("terms")
            .checked;


        /*
        PHONE
        */

        if (!validRwandaPhone(phone)) {

          showMessage(
            "Please enter a valid Rwanda phone number.",
            "error"
          );

          return;

        }


        /*
        PASSWORD
        */

        if (password.length < 6) {

          showMessage(
            "Password must contain at least 6 characters.",
            "error"
          );

          return;

        }


        /*
        CONFIRM PASSWORD
        */

        if (password !== confirmPassword) {

          showMessage(
            "Passwords do not match.",
            "error"
          );

          return;

        }


        /*
        TERMS
        */

        if (!terms) {

          showMessage(
            "Please accept the Terms & Conditions.",
            "error"
          );

          return;

        }


        /*
        DISABLE BUTTON
        */

        button.disabled = true;

        button.textContent =
          "Creating Account...";


        /*
        ======================================
          TEMPORARY CUSTOMER REGISTRATION
        ======================================

          This allows us to test the complete
          frontend flow before connecting the
          real backend/database.

          IMPORTANT:
          We do NOT store the password here.
        ======================================
        */

        try {

          const customer = {

            role: "customer",

            phone:
              "+250" + phone,

            balance: 0,

            bonusBalance: 0,

            profilePicture: "",

            createdAt:
              new Date().toISOString()

          };


          /*
          SAVE CUSTOMER SESSION
          */

          localStorage.setItem(
            "betkigaliUser",
            JSON.stringify(customer)
          );


          /*
          MARK CUSTOMER AS LOGGED IN
          */

          localStorage.setItem(
            "betkigaliLoggedIn",
            "true"
          );


          /*
          SUCCESS
          */

          showMessage(
            "Account created successfully. Welcome to BetKigali!",
            "success"
          );


          /*
          GO DIRECTLY TO REAL HOME PAGE
          */

          setTimeout(
            function() {

              window.location.href =
                "index.html";

            },
            700
          );


        } catch (error) {

          console.error(error);

          showMessage(
            "Unable to create your account. Please try again.",
            "error"
          );

          button.disabled = false;

          button.textContent =
            "Create Account";

        }

      }
    );

  </script>

</body>
</html>
