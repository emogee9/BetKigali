<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BetKigali - Register</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #080b0f;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .register-box {
      width: 100%;
      max-width: 430px;
      background: #11171e;
      border: 1px solid #242d37;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 10px 35px rgba(0,0,0,.35);
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo img {
      width: 150px;
      max-width: 100%;
      height: auto;
    }

    h1 {
      text-align: center;
      color: #f5c542;
      margin-bottom: 8px;
      font-size: 27px;
    }

    .subtitle {
      text-align: center;
      color: #9ca7b3;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 17px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #d7dde5;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border-radius: 9px;
      border: 1px solid #303a46;
      background: #080b0f;
      color: white;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #f5c542;
    }

    .phone-wrap {
      display: flex;
      gap: 8px;
    }

    .country-code {
      width: 85px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #303a46;
      border-radius: 9px;
      background: #080b0f;
      color: #f5c542;
      font-weight: bold;
    }

    .phone-wrap input {
      flex: 1;
    }

    .register-btn {
      width: 100%;
      margin-top: 8px;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #f5c542;
      color: #080b0f;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .register-btn:hover {
      background: #ffd75e;
    }

    .register-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 12px;
      margin-bottom: 18px;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
    }

    .message.error {
      display: block;
      background: #3a1515;
      border: 1px solid #7f1d1d;
      color: #fecaca;
    }

    .message.success {
      display: block;
      background: #12351f;
      border: 1px solid #166534;
      color: #bbf7d0;
    }

    .login-link {
      text-align: center;
      margin-top: 22px;
      color: #9ca7b3;
      font-size: 14px;
    }

    .login-link a {
      color: #f5c542;
      text-decoration: none;
      font-weight: bold;
    }

    .login-link a:hover {
      text-decoration: underline;
    }

    .note {
      margin-top: 18px;
      color: #64748b;
      font-size: 12px;
      text-align: center;
      line-height: 1.5;
    }

    @media (max-width: 450px) {
      .register-box {
        padding: 23px 18px;
      }
    }
  </style>
</head>

<body>

  <div class="register-box">

    <div class="logo">
      <a href="index.html">
        <img
          src="betkigali-logo.png"
          alt="BetKigali"
        >
      </a>
    </div>

    <h1>Create Account</h1>

    <p class="subtitle">
      Register with your phone number
    </p>

    <div id="message" class="message"></div>

    <form id="registerForm">

      <div class="form-group">

        <label for="phone">
          Phone Number
        </label>

        <div class="phone-wrap">

          <div class="country-code">
            +250
          </div>

          <input
            type="tel"
            id="phone"
            placeholder="7XXXXXXXX"
            inputmode="numeric"
            autocomplete="tel"
            maxlength="9"
            required
          >

        </div>

      </div>

      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          placeholder="At least 6 characters"
          autocomplete="new-password"
          minlength="6"
          required
        >

      </div>

      <div class="form-group">

        <label for="confirmPassword">
          Confirm Password
        </label>

        <input
          type="password"
          id="confirmPassword"
          placeholder="Repeat your password"
          autocomplete="new-password"
          minlength="6"
          required
        >

      </div>

      <button
        type="submit"
        id="registerBtn"
        class="register-btn"
      >
        Register
      </button>

    </form>

    <div class="login-link">
      Already have an account?
      <a href="login.html">Login</a>
    </div>

    <div class="note">
      By registering, you agree to use BetKigali responsibly.
    </div>

  </div>


  <script>

    /*
      BetKigali Worker
    */

    const API_URL =
      "https://betkigali.geekemo226.workers.dev";


    const form =
      document.getElementById(
        "registerForm"
      );

    const message =
      document.getElementById(
        "message"
      );

    const registerBtn =
      document.getElementById(
        "registerBtn"
      );


    function showMessage(
      text,
      type
    ) {

      message.textContent = text;

      message.className =
        "message " + type;

    }


    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        message.className =
          "message";

        const phoneInput =
          document
            .getElementById("phone")
            .value
            .trim();

        const password =
          document
            .getElementById("password")
            .value;

        const confirmPassword =
          document
            .getElementById(
              "confirmPassword"
            )
            .value;


        /*
          Phone validation
        */

        const phone =
          phoneInput.replace(
            /\D/g,
            ""
          );


        if (
          !/^7\d{8}$/.test(phone)
        ) {

          showMessage(
            "Enter a valid Rwanda phone number, e.g. 781234567.",
            "error"
          );

          return;
        }


        /*
          Password validation
        */

        if (
          password.length < 6
        ) {

          showMessage(
            "Password must be at least 6 characters.",
            "error"
          );

          return;
        }


        /*
          Confirm password
        */

        if (
          password !==
          confirmPassword
        ) {

          showMessage(
            "Passwords do not match.",
            "error"
          );

          return;
        }


        /*
          Full phone number
        */

        const fullPhone =
          "+250" + phone;


        /*
          Disable button
        */

        registerBtn.disabled =
          true;

        registerBtn.textContent =
          "Creating account...";


        try {

          const response =
            await fetch(
              API_URL +
              "/api/register",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify({
                    phone:
                      fullPhone,

                    password:
                      password
                  })
              }
            );


          const data =
            await response.json();


          if (
            !response.ok ||
            !data.success
          ) {

            throw new Error(
              data.message ||
              "Registration failed."
            );

          }


          /*
            Save login session
          */

          localStorage.setItem(
            "betkigaliToken",
            data.token
          );


          localStorage.setItem(
            "betkigaliUser",
            JSON.stringify(
              data.user
            )
          );


          showMessage(
            "Account created successfully. Redirecting...",
            "success"
          );


          /*
            Go to main page
          */

          setTimeout(
            function() {

              window.location.href =
                "index.html";

            },
            800
          );


        } catch (error) {

          console.error(
            "Registration error:",
            error
          );

          showMessage(
            error.message ||
            "Unable to create account. Please try again.",
            "error"
          );

          registerBtn.disabled =
            false;

          registerBtn.textContent =
            "Register";

        }

      }
    );

  </script>

</body>
</html>
```
