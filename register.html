<script>
/* =========================================
   SUPABASE CONFIG
========================================= */

const SUPABASE_URL =
  "https://nezgaxfisytlgkhdgzvf.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_H1N6DRzZ0t25MARQP5yaPQ_l6mRsrVGs";

const supabase =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================
   ELEMENTS
========================================= */

const form =
  document.getElementById("registerForm");

const phoneInput =
  document.getElementById("phone");

const passwordInput =
  document.getElementById("password");

const confirmPasswordInput =
  document.getElementById("confirmPassword");

const registerBtn =
  document.getElementById("registerBtn");

const messageBox =
  document.getElementById("message");

const loading =
  document.getElementById("loading");


/* =========================================
   MESSAGE
========================================= */

function showMessage(text, type) {

  messageBox.textContent = text;

  if (!text) {
    messageBox.className = "message";
    return;
  }

  messageBox.className =
    "message " + type;
}


/* =========================================
   NORMALIZE PHONE
========================================= */

function normalizePhone(value) {

  let phone =
    value
      .trim()
      .replace(/\s+/g, "");

  if (phone.startsWith("+250")) {
    phone = phone.substring(1);
  }

  if (phone.startsWith("0")) {
    phone =
      "250" + phone.substring(1);
  }

  return phone;
}


/* =========================================
   INTERNAL AUTH EMAIL
========================================= */

function makeAuthEmail(phone) {

  return (
    phone +
    "@auth.betkigali.local"
  );
}


/* =========================================
   SAVE USER
========================================= */

function saveUser(user, profile) {

  const userData = {

    id: user.id,

    user_id: user.id,

    phone:
      profile?.phone || "",

    balance:
      Number(profile?.balance || 0),

    bonus_balance:
      Number(profile?.bonus_balance || 0),

    role:
      profile?.role || "customer",

    profile_picture:
      profile?.profile_picture || ""

  };


  localStorage.setItem(
    "betkigaliUser",
    JSON.stringify(userData)
  );

  localStorage.setItem(
    "betkigaliProfile",
    JSON.stringify(userData)
  );

  localStorage.setItem(
    "betkigaliLoggedIn",
    "true"
  );

  return userData;
}


/* =========================================
   REGISTER
========================================= */

form.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    showMessage("", "");

    registerBtn.disabled = true;

    loading.style.display = "block";

    loading.textContent =
      "Creating your account...";


    try {

      /* -------------------------------------
         VALUES
      ------------------------------------- */

      const phone =
        normalizePhone(
          phoneInput.value
        );

      const password =
        passwordInput.value;

      const confirmPassword =
        confirmPasswordInput.value;


      /* -------------------------------------
         VALIDATION
      ------------------------------------- */

      if (!phone) {

        throw new Error(
          "Please enter your phone number."
        );

      }

      if (
        phone.length !== 12 ||
        !phone.startsWith("250")
      ) {

        throw new Error(
          "Please enter a valid Rwanda phone number."
        );

      }

      if (password.length < 6) {

        throw new Error(
          "Password must contain at least 6 characters."
        );

      }

      if (
        password !== confirmPassword
      ) {

        throw new Error(
          "Passwords do not match."
        );

      }


      /* -------------------------------------
         INTERNAL EMAIL
      ------------------------------------- */

      const authEmail =
        makeAuthEmail(phone);


      /* -------------------------------------
         CREATE AUTH ACCOUNT
      ------------------------------------- */

      const {
        data,
        error
      } =
        await supabase.auth.signUp({

          email: authEmail,

          password: password,

          options: {

            data: {
              phone: phone
            }

          }

        });


      if (error) {
        throw error;
      }


      if (
        !data ||
        !data.user
      ) {

        throw new Error(
          "Account could not be created."
        );

      }


      /* -------------------------------------
         CHECK SESSION
      ------------------------------------- */

      let session =
        data.session;


      /*
        If Supabase did not return a session,
        check again.
      */

      if (!session) {

        const sessionResult =
          await supabase.auth.getSession();

        session =
          sessionResult.data?.session;

      }


      /*
        Without a session, the INSERT policy
        on profiles cannot authorize the user.
      */

      if (!session) {

        throw new Error(
          "Account was created, but automatic login is disabled. Please turn OFF Email Confirmation in Supabase Authentication → Sign In / Providers → Email, then try again."
        );

      }


      /* -------------------------------------
         CREATE PROFILE
      ------------------------------------- */

      loading.textContent =
        "Creating your profile...";


      const {
        data: profile,
        error: profileError
      } =
        await supabase
          .from("profiles")
          .insert({

            id: data.user.id,

            phone: phone,

            profile_picture: "",

            balance: 0,

            bonus_balance: 0,

            role: "customer"

          })
          .select()
          .single();


      /*
        If profile already exists,
        retrieve it instead.
      */

      if (
        profileError
      ) {

        console.error(
          "PROFILE ERROR:",
          profileError
        );


        /*
          Try to retrieve existing profile.
        */

        const existing =
          await supabase
            .from("profiles")
            .select(
              "id,phone,profile_picture,balance,bonus_balance,role,created_at"
            )
            .eq(
              "id",
              data.user.id
            )
            .maybeSingle();


        if (
          existing.data
        ) {

          saveUser(
            data.user,
            existing.data
          );

        } else {

          throw profileError;

        }

      } else {

        saveUser(
          data.user,
          profile
        );

      }


      /* -------------------------------------
         SUCCESS
      ------------------------------------- */

      showMessage(
        "Account created successfully!",
        "success"
      );

      loading.textContent =
        "Opening BetKigali...";


      /*
        Give the browser a tiny moment
        to save the Supabase session.
      */

      setTimeout(
        function() {

          window.location.replace(
            "index.html"
          );

        },
        500
      );


    } catch (error) {

      console.error(
        "REGISTRATION ERROR:",
        error
      );


      let message =
        error?.message ||
        "Registration failed. Please try again.";


      const lower =
        message.toLowerCase();


      if (
        lower.includes(
          "user already registered"
        ) ||
        lower.includes(
          "already registered"
        )
      ) {

        message =
          "This phone number is already registered. Please login.";

      }


      if (
        lower.includes(
          "duplicate key"
        )
      ) {

        message =
          "This phone number already has a profile.";

      }


      if (
        lower.includes(
          "row-level security"
        )
      ) {

        message =
          "Supabase blocked profile creation. Check the profiles INSERT policy.";

      }


      showMessage(
        message,
        "error"
      );


    } finally {

      registerBtn.disabled =
        false;

      loading.style.display =
        "none";

    }

  }
);
</script>
