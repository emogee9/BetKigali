<script>

/* =========================================
   SUPABASE CONFIG
========================================= */

const SUPABASE_URL =
  "https://nezgaxfisytlgkhdgzvf.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_H1N6DRzZ0t25MARQP5yaPQ_l6mRsrVGs";

const supabase =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================
   ELEMENTS
========================================= */

const form =
  document.getElementById("registerForm");

const phoneInput =
  document.getElementById("phone");

const passwordInput =
  document.getElementById("password");

const confirmPasswordInput =
  document.getElementById("confirmPassword");

const registerBtn =
  document.getElementById("registerBtn");

const messageBox =
  document.getElementById("message");

const loading =
  document.getElementById("loading");


/* =========================================
   MESSAGE
========================================= */

function showMessage(text, type) {

  messageBox.textContent = text;

  if (!text) {
    messageBox.className = "message";
    return;
  }

  messageBox.className =
    "message " + type;
}


/* =========================================
   PHONE
========================================= */

function normalizePhone(value) {

  let phone =
    value
      .trim()
      .replace(/\s+/g, "");

  if (phone.startsWith("+250")) {
    phone = phone.substring(1);
  }

  if (phone.startsWith("0")) {
    phone =
      "250" + phone.substring(1);
  }

  return phone;
}


/* =========================================
   INTERNAL EMAIL
========================================= */

function makeAuthEmail(phone) {

  return (
    phone +
    "@auth.betkigali.local"
  );
}


/* =========================================
   SAVE USER
========================================= */

function saveUser(user, profile) {

  const userData = {

    id:
      user.id,

    user_id:
      user.id,

    phone:
      profile?.phone || "",

    balance:
      Number(profile?.balance || 0),

    bonus_balance:
      Number(profile?.bonus_balance || 0),

    role:
      profile?.role || "customer",

    profile_picture:
      profile?.profile_picture || ""

  };


  localStorage.setItem(
    "betkigaliUser",
    JSON.stringify(userData)
  );


  localStorage.setItem(
    "betkigaliProfile",
    JSON.stringify(userData)
  );


  localStorage.setItem(
    "betkigaliLoggedIn",
    "true"
  );


  return userData;
}


/* =========================================
   REGISTER
========================================= */

form.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    showMessage("", "");


    registerBtn.disabled =
      true;

    loading.style.display =
      "block";

    loading.textContent =
      "Creating your account...";


    try {

      /* -------------------------------------
         VALUES
      ------------------------------------- */

      const phone =
        normalizePhone(
          phoneInput.value
        );

      const password =
        passwordInput.value;

      const confirmPassword =
        confirmPasswordInput.value;


      /* -------------------------------------
         VALIDATE PHONE
      ------------------------------------- */

      if (
        phone.length !== 12 ||
        !phone.startsWith("250")
      ) {

        throw new Error(
          "Please enter a valid Rwanda phone number."
        );

      }


      /* -------------------------------------
         VALIDATE PASSWORD
      ------------------------------------- */

      if (
        password.length < 6
      ) {

        throw new Error(
          "Password must contain at least 6 characters."
        );

      }


      if (
        password !==
        confirmPassword
      ) {

        throw new Error(
          "Passwords do not match."
        );

      }


      /* -------------------------------------
         AUTH EMAIL
      ------------------------------------- */

      const authEmail =
        makeAuthEmail(
          phone
        );


      /* -------------------------------------
         CREATE AUTH USER
      ------------------------------------- */

      loading.textContent =
        "Creating your account...";


      const {
        data,
        error
      } =
        await supabase.auth.signUp({

          email:
            authEmail,

          password:
            password,

          options: {

            data: {

              phone:
                phone

            }

          }

        });


      if (error) {
        throw error;
      }


      if (
        !data ||
        !data.user
      ) {

        throw new Error(
          "Account could not be created."
        );

      }


      /* -------------------------------------
         SESSION
      ------------------------------------- */

      let session =
        data.session;


      if (!session) {

        const sessionResult =
          await supabase.auth.getSession();

        session =
          sessionResult.data?.session;

      }


      /*
        We need an active session because
        profiles INSERT uses auth.uid().
      */

      if (!session) {

        throw new Error(
          "Account was created, but automatic login is disabled. Turn OFF Email Confirmation in Supabase Authentication settings, then try again."
        );

      }


      /* -------------------------------------
         CREATE PROFILE
      ------------------------------------- */

      loading.textContent =
        "Creating your profile...";


      const profileResult =
        await supabase
          .from("profiles")
          .insert({

            id:
              data.user.id,

            phone:
              phone,

            profile_picture:
              "",

            balance:
              0,

            bonus_balance:
              0,

            role:
              "customer"

          })
          .select()
          .single();


      let profile;


      /* -------------------------------------
         PROFILE RESULT
      ------------------------------------- */

      if (
        profileResult.error
      ) {

        console.error(
          "PROFILE ERROR:",
          profileResult.error
        );


        /*
          Maybe profile already exists.
        */

        const existing =
          await supabase
            .from("profiles")
            .select(
              "id,phone,profile_picture,balance,bonus_balance,role,created_at"
            )
            .eq(
              "id",
              data.user.id
            )
            .maybeSingle();


        if (
          existing.data
        ) {

          profile =
            existing.data;

        } else {

          throw profileResult.error;

        }

      } else {

        profile =
          profileResult.data;

      }


      /* -------------------------------------
         SAVE USER
      ------------------------------------- */

      saveUser(
        data.user,
        profile
      );


      /* -------------------------------------
         SUCCESS
      ------------------------------------- */

      showMessage(
        "Account created successfully!",
        "success"
      );


      loading.style.display =
        "block";

      loading.textContent =
        "Opening BetKigali...";


      /*
        IMPORTANT:

        Do NOT reload register.html.
        Do NOT use href to register.html.

        Go directly to index.html.
      */

      window.location.replace(
        "index.html"
      );

    } catch (error) {

      console.error(
        "REGISTRATION ERROR:",
        error
      );


      let errorMessage =
        error?.message ||
        "Registration failed. Please try again.";


      const lower =
        errorMessage.toLowerCase();


      if (
        lower.includes(
          "user already registered"
        ) ||
        lower.includes(
          "already registered"
        )
      ) {

        errorMessage =
          "This phone number is already registered. Please login.";

      }


      if (
        lower.includes(
          "duplicate key"
        )
      ) {

        errorMessage =
          "This phone number already has a profile.";

      }


      if (
        lower.includes(
          "row-level security"
        )
      ) {

        errorMessage =
          "Supabase blocked profile creation. Check the profiles INSERT policy.";

      }


      showMessage(
        errorMessage,
        "error"
      );


      loading.style.display =
        "none";


    } finally {

      registerBtn.disabled =
        false;

    }

  }
);

</script>

</body>
</html>
